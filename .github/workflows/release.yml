name: Package theme on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag or ref to package (defaults to the newest release tag)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: package-theme
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # The tag is resolved once and reused by every later step. A manual
      # workflow_dispatch may leave `tag` empty, in which case the newest
      # release tag is looked up; referencing the raw input would have made
      # `gh release upload "$TAG"` fail with an empty argument even though
      # checkout had already resolved the ref. Every step below therefore
      # reads `steps.ref.outputs.ref`, so the built ref, the uploaded asset
      # and the reported size can never disagree.
      - name: Resolve the ref to build
        id: ref
        run: |
          set -euo pipefail
          ref="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$ref" ]; then
            ref="$(gh release view --json tagName --jq .tagName)"
          fi
          if [ -z "$ref" ]; then
            echo "::error::no tag supplied and no release tag found"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Packaging $ref"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      # One packaging path. tools/build.sh owns what goes into the archive, so a
      # change in package contents can never diverge between CI and a local build.
      - name: Build the .bbgtheme2 archive
        run: bash tools/build.sh

      # A release that ships a broken archive is worse than a failed job: the
      # registry resolves the asset by name and would silently serve nothing.
      - name: Guard the archive
        run: |
          set -euo pipefail
          zip=dist/antiphon-v2.bbgtheme2
          test -s "$zip" || { echo "::error::$zip is missing or empty"; exit 1; }
          unzip -l "$zip" | grep -q 'index.html' || { echo "::error::archive has no index.html"; exit 1; }
          unzip -q -o "$zip" -d /tmp/guard
          for required in index.html css js themecfg; do
            test -e "/tmp/guard/$required" || { echo "::error::archive is missing $required"; exit 1; }
          done
          unzip -t "$zip" > /dev/null || { echo "::error::archive is corrupt"; exit 1; }

      - name: Attach the archive to the release
        run: gh release upload "${{ steps.ref.outputs.ref }}" dist/antiphon-v2.bbgtheme2 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the published size
        run: |
          set -euo pipefail
          bytes=$(wc -c < dist/antiphon-v2.bbgtheme2 | tr -d ' ')
          echo "Published antiphon-v2.bbgtheme2 ($bytes bytes) on ${{ steps.ref.outputs.ref }}"
          gh release view "${{ steps.ref.outputs.ref }}" --json assets \
            --jq '.assets[] | select(.name=="antiphon-v2.bbgtheme2") | "\(.name) \(.size) bytes state=\(.state)"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: antiphon-v2.bbgtheme2
          path: dist/antiphon-v2.bbgtheme2
          if-no-files-found: error

# Note: a `release: published` trigger runs against the freshly published tag,
# while workflow_dispatch defaults to the newest release tag, so a manual re-run
# repackages the same asset in place. The registry's download_url points at
# releases/latest/download/antiphon-v2.bbgtheme2, so this name must not change.
